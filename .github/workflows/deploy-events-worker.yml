name: Deploy SYNAPT Events Worker

on:
  push:
    paths:
      - "workers/synapt-events/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy Worker
        run: |
          cd workers/synapt-events
          wrangler deploy --name synapt-events
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9cd06a9cb40a471bc7a2adb149d1df5a

      - name: Set SYNC_TOKEN secret
        run: |
          cd workers/synapt-events
          echo "${{ secrets.SYNAPT_SYNC_TOKEN }}" | wrangler secret put SYNC_TOKEN --name synapt-events
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9cd06a9cb40a471bc7a2adb149d1df5a

